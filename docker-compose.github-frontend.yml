# Docker Compose configuration using frontend from GitHub
# Usage: docker-compose -f docker-compose.github-frontend.yml up -d
#
# Set these environment variables:
#   GITHUB_REPO_URL=username/repo-name (e.g., kleber/frontend-repo)
#   GITHUB_BRANCH=main (optional, defaults to main)
#   GITHUB_TOKEN=your_github_token (optional, for private repos)

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: msp_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-msp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-msp_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-msp_user} -d ${POSTGRES_DB:-msp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: msp_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://frontend:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.github.prod
      args:
        # GitHub repository URL (format: username/repo-name or full URL)
        GITHUB_REPO_URL: ${GITHUB_REPO_URL}
        # Branch to clone (default: main)
        GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
        # GitHub token for private repos (optional)
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        # Frontend build environment variables
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY:-}
    container_name: msp_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:

