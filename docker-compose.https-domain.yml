# Docker Compose configuration for HTTPS with domain (peres.systems)
# Uses Let's Encrypt certificates
# Usage: docker-compose -f docker-compose.https-domain.yml up -d

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: msp_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-msp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-msp_db}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-msp_user} -d ${POSTGRES_DB:-msp_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: msp_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://peres.systems,https://www.peres.systems,http://localhost:5173,http://localhost:3000,http://frontend:5173}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      RELEASE_VERSION: ${RELEASE_VERSION:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.1}
    expose:
      - "8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      # Change to Dockerfile.frontend.github.prod if using GitHub frontend
      # Set GITHUB_REPO_URL in .env to use GitHub frontend
      dockerfile: Dockerfile.frontend.prod
      args:
        # GitHub repository configuration (if using GitHub frontend)
        # Uncomment and set GITHUB_REPO_URL in .env to use GitHub frontend
        GITHUB_REPO_URL: ${GITHUB_REPO_URL:-}
        GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        # Frontend build environment variables
        VITE_API_URL: ${VITE_API_URL:-https://peres.systems}
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY:-}
    container_name: msp_frontend
    environment:
      # Let's Encrypt configuration
      VIRTUAL_HOST: ${DOMAIN:-peres.systems},www.${DOMAIN:-peres.systems}
      LETSENCRYPT_HOST: ${DOMAIN:-peres.systems},www.${DOMAIN:-peres.systems}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@peres.systems}
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: msp_nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
    labels:
      - "com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy"
    restart: unless-stopped

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: msp_acme_companion
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - acme_data:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL:-admin@peres.systems}
    depends_on:
      - nginx-proxy
    restart: unless-stopped

  # Log Aggregation Stack
  loki:
    image: grafana/loki:2.9.0
    container_name: msp_loki

    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: msp_promtail
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    container_name: msp_grafana

    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  postgres_data:
  loki_data:
  grafana_data:
  nginx_certs:
  nginx_vhost:
  nginx_html:
  acme_data:


